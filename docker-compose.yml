services:
  ldap-rti:
    build:
      context: .
      dockerfile: ldap/Dockerfile
    image: lab/openldap:local
    environment:
      LDAP_BASE_DN: ${LDAP_RTI_BASE_DN}
      LDAP_ADMIN_PASSWORD: ${LDAP_RTI_ADMIN_PASSWORD}
      LDAP_BASE_LDIF: /seed/base.ldif
      LDAP_USERS_LDIF: /seed/users.ldif
      AUTO_POPULATE: ${AUTO_POPULATE}
      LAB_MODE: ${LAB_MODE:-manual}
    ports:
      - "389:389"
    volumes:
      - ldap_rti_data:/var/lib/ldap
      - ./ldap-rti/base.ldif:/seed/base.ldif:ro
      - ./ldap-rti/users.ldif:/seed/users.ldif:ro
    networks:
      - lab-network
    healthcheck:
      test: ["CMD", "ldapwhoami", "-x", "-H", "ldap://localhost:389", "-D", "cn=admin,dc=rti,dc=etf,dc=bg,dc=ac,dc=rs", "-w", "${LDAP_RTI_ADMIN_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ldap-si:
    build:
      context: .
      dockerfile: ldap/Dockerfile
    image: lab/openldap:local
    environment:
      LDAP_BASE_DN: ${LDAP_SI_BASE_DN}
      LDAP_ADMIN_PASSWORD: ${LDAP_SI_ADMIN_PASSWORD}
      LDAP_BASE_LDIF: /seed/base.ldif
      LDAP_USERS_LDIF: /seed/users.ldif
      AUTO_POPULATE: ${AUTO_POPULATE}
      LAB_MODE: ${LAB_MODE:-manual}
    ports:
      - "390:389"
    volumes:
      - ldap_si_data:/var/lib/ldap
      - ./ldap-si/base.ldif:/seed/base.ldif:ro
      - ./ldap-si/users.ldif:/seed/users.ldif:ro
    networks:
      - lab-network
    healthcheck:
      test: ["CMD", "ldapwhoami", "-x", "-H", "ldap://localhost:389", "-D", "cn=admin,dc=si,dc=etf,dc=bg,dc=ac,dc=rs", "-w", "${LDAP_SI_ADMIN_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-rti:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_A_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_A_HTTP_PORT}:8080"
    volumes:
      - ./keycloak/realms/keycloak-rti:/opt/keycloak/data/import:ro
      - keycloak_a_data:/opt/keycloak/data
    networks:
      - lab-network
    extra_hosts:
      - "rti.localhost:host-gateway"
      - "si.localhost:host-gateway"
    depends_on:
      ldap-rti:
        condition: service_healthy
    healthcheck:
      # Keycloak images have no curl/wget; use bash /dev/tcp to probe the HTTP port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/${KEYCLOAK_A_REALM} HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  keycloak-si:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_B_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_B_HTTP_PORT}:8080"
    volumes:
      - ./keycloak/realms/keycloak-si:/opt/keycloak/data/import:ro
      - keycloak_b_data:/opt/keycloak/data
    networks:
      - lab-network
    extra_hosts:
      - "rti.localhost:host-gateway"
      - "si.localhost:host-gateway"
    depends_on:
      ldap-si:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/${KEYCLOAK_B_REALM} HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  keycloak-init:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    entrypoint: ["/bin/bash", "/opt/lab-scripts/init-keycloak.sh"]
    environment:
      KC_LDAP_USERS_MODE: ${KC_LDAP_USERS_MODE}
      LAB_MODE: ${LAB_MODE:-manual}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_A_URL: http://keycloak-rti:8080
      KEYCLOAK_B_URL: http://keycloak-si:8080
      KEYCLOAK_A_REALM: ${KEYCLOAK_A_REALM}
      KEYCLOAK_B_REALM: ${KEYCLOAK_B_REALM}
      KEYCLOAK_LDAP_BIND_PASSWORD: ${KEYCLOAK_LDAP_BIND_PASSWORD}
      WEBAPP_A_REDIRECT_URI: ${WEBAPP_A_REDIRECT_URI}
      WEBAPP_B_ACS_URL: ${WEBAPP_B_ACS_URL}
      WEBAPP_B_SLS_URL: ${WEBAPP_B_SLS_URL:-http://localhost:4000/saml/sls}
      SSO_SESSION_IDLE_TIMEOUT: ${SSO_SESSION_IDLE_TIMEOUT:-300}
      SSO_SESSION_MAX_LIFESPAN: ${SSO_SESSION_MAX_LIFESPAN:-300}
      API_AUDIENCE: ${API_AUDIENCE:-oauth2-api}
    volumes:
      - ./keycloak/scripts:/opt/lab-scripts:ro
    networks:
      - lab-network
    depends_on:
      keycloak-rti:
        condition: service_started
      keycloak-si:
        condition: service_started
      ldap-rti:
        condition: service_healthy
      ldap-si:
        condition: service_healthy
    restart: "no"

  keycloak-federation-init:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    entrypoint: ["/bin/bash", "/opt/lab-scripts/init-federation.sh"]
    environment:
      KC_FEDERATION_MODE: ${KC_FEDERATION_MODE}
      LAB_MODE: ${LAB_MODE:-manual}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_A_URL: http://keycloak-rti:8080
      KEYCLOAK_B_URL: http://keycloak-si:8080
      KEYCLOAK_A_REALM: ${KEYCLOAK_A_REALM}
      KEYCLOAK_B_REALM: ${KEYCLOAK_B_REALM}
      KEYCLOAK_A_HOSTNAME: ${KEYCLOAK_A_HOSTNAME}
      KEYCLOAK_B_HOSTNAME: ${KEYCLOAK_B_HOSTNAME}
      API_REQUIRED_GROUP: ${API_REQUIRED_GROUP:-api-access}
      KC_FEDERATION_LOGOUT_PROPAGATION: ${KC_FEDERATION_LOGOUT_PROPAGATION:-off}
    volumes:
      - ./keycloak/scripts:/opt/lab-scripts:ro
    networks:
      - lab-network
    extra_hosts:
      - "rti.localhost:host-gateway"
      - "si.localhost:host-gateway"
    depends_on:
      keycloak-rti:
        condition: service_started
      keycloak-si:
        condition: service_started
    restart: "no"

  webapp-rti-oauth2:
    build:
      context: ./webapp-rti-oauth2
      dockerfile: Dockerfile
    environment:
      VITE_OIDC_AUTHORITY: ${WEBAPP_A_OIDC_AUTHORITY:-http://rti.localhost:8081/realms/rti}
      VITE_OIDC_CLIENT_ID: ${WEBAPP_A_OIDC_CLIENT_ID:-webapp-rti-oauth2}
      VITE_OIDC_REDIRECT_URI: ${WEBAPP_A_OIDC_REDIRECT_URI:-http://localhost:3000}
      VITE_API_BASE_URL: ${WEBAPP_A_API_BASE_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    networks:
      - lab-network
    depends_on:
      keycloak-rti:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
      keycloak-federation-init:
        condition: service_completed_successfully

  webapp-si-saml-backend:
    build:
      context: ./webapp-si-saml/backend
      dockerfile: Dockerfile
    environment:
      PORT: "4001"
      FRONTEND_URL: ${WEBAPP_B_FRONTEND_URL:-http://localhost:4000}
      SAML_ENTRY_POINT: ${WEBAPP_B_SAML_ENTRY_POINT:-http://si.localhost:8082/realms/si/protocol/saml}
      SAML_IDP_ISSUER: ${WEBAPP_B_SAML_IDP_ISSUER:-http://si.localhost:8082/realms/si}
      SAML_ISSUER: ${WEBAPP_B_SAML_ISSUER:-webapp-si-saml}
      SAML_ACS_URL: ${WEBAPP_B_ACS_URL:-http://localhost:4000/saml/acs}
      SAML_METADATA_URL: ${WEBAPP_B_SAML_METADATA_URL:-http://keycloak-si:8080/realms/si/protocol/saml/descriptor}
      SESSION_SECRET: ${WEBAPP_B_SESSION_SECRET:-webapp-si-saml-dev-secret}
    networks:
      - lab-network
    extra_hosts:
      - "rti.localhost:host-gateway"
      - "si.localhost:host-gateway"
    depends_on:
      keycloak-si:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
      keycloak-federation-init:
        condition: service_completed_successfully

  webapp-si-saml-frontend:
    build:
      context: ./webapp-si-saml/frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://webapp-si-saml-backend:4001
    ports:
      - "4000:4000"
    networks:
      - lab-network
    depends_on:
      webapp-si-saml-backend:
        condition: service_started

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: "5000"
      API_ISSUER: ${API_ISSUER:-http://rti.localhost:8081/realms/rti}
      API_JWKS_URI: ${API_JWKS_URI:-http://keycloak-rti:8080/realms/rti/protocol/openid-connect/certs}
      API_AUDIENCE: ${API_AUDIENCE:-oauth2-api}
      API_REQUIRED_GROUP: ${API_REQUIRED_GROUP:-api-access}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "5000:5000"
    networks:
      - lab-network
    extra_hosts:
      - "rti.localhost:host-gateway"
      - "si.localhost:host-gateway"
    depends_on:
      keycloak-rti:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
      keycloak-federation-init:
        condition: service_completed_successfully

volumes:
  ldap_rti_data:
  ldap_si_data:
  keycloak_a_data:
  keycloak_b_data:

networks:
  lab-network:
    driver: bridge
